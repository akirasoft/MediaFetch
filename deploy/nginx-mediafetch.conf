# ─────────────────────────────────────────────────────────────
# MediaFetch — nginx ters proxy
#
# ⚠ SUNUCU_IP İÇİN ÖNEMLİ:
#   Bu sunucuda 80 portunu **Pterodactyl panelinin kendisi** kullanıyor
#   (nginx/1.18.0 + Laravel). Yani http://SUNUCU_IP/ adresinin kökü
#   panele ait. Aşağıdaki "server_name SUNUCU_IP" bloğunu olduğu gibi
#   eklersen paneli erişilemez hale getirirsin — EKLEME.
#
#   Doğru kullanım: uygulamaya kendi portundan gir →
#       http://SUNUCU_IP:8422
#
#   Bu dosya yalnızca şu iki durum için:
#     A) MediaFetch'i bir ALT ALAN ADINDA yayınlamak istiyorsan
#        (ör. indir.alanadin.com) → server_name satırını değiştir.
#     B) Pterodactyl'in olmadığı başka bir Ubuntu sunucusuna kuruyorsan.
#
#   Kurulum:
#     sudo cp deploy/nginx-mediafetch.conf /etc/nginx/sites-available/mediafetch
#     sudo ln -s /etc/nginx/sites-available/mediafetch /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────

upstream mediafetch_app {
    server 127.0.0.1:8422;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # ⚠ Kendi alan adınla değiştir. Çıplak IP yazarsan paneli ezersin.
    server_name indir.alanadin.com;

    # Büyük bir gövde yüklenmiyor ama indirilen dosya buradan geçiyor:
    # yanıtı tamponlamadan akıt.
    client_max_body_size 8m;
    proxy_buffering off;
    proxy_request_buffering off;

    # Uzun süren indirmeler ve canlı ilerleme WebSocket'i kopmasın.
    proxy_connect_timeout 30s;
    proxy_send_timeout    1h;
    proxy_read_timeout    1h;
    send_timeout          1h;

    location / {
        proxy_pass http://mediafetch_app;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# $connection_upgrade http bloğunda tanımlı olmalı. Yoksa
# /etc/nginx/nginx.conf içindeki http { } bloğuna şunu ekle:
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
#
# NOT: Alt dizin (ör. /mediafetch/) ile yayınlamak ÇALIŞMAZ — arayüz
# /api/... gibi kök yolları kullanıyor. Alt alan adı ya da port kullan.
